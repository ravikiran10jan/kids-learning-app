name: kids_learning_app
description: "Kids learning app with Math and English"
publish_to: 'none'
version: 3.1.0+11

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  audioplayers: ^6.1.0
  intl: ^0.19.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon/app_icon.png"
